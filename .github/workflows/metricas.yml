name: Métricas semanales de YouTube

on:
  schedule:
    - cron: "17 6 * * 1"   # cada lunes a las 06:17 UTC (08:17 en España en verano, 07:17 en invierno)
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install gspread requests

      - name: Apuntar métricas en Google Sheets
        run: python actualizar_metricas.py
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CANALES: ${{ secrets.YOUTUBE_CANALES }}
